<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Bomb Status</title>
  <link rel="stylesheet" href="./css/map.css">
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Bomb Status</h1>
      <div class="controls">
        <p id="lastRefresh" class="description">Last updated: -</p>
      </div>
    </header>

    <!-- Countdown timer -->
    <div class="panel timer-container">
      <div id="timerDisplay" class="timer-display">15:00</div>
      <div class="timer-controls">
        <button id="timerStartBtn" type="button">Start</button>
        <button id="timerResetBtn" type="button" class="secondary">Reset</button>
      </div>
    </div>

    <!-- Bomb status summary -->
    <div id="statsContainer" class="panel stats-container"></div>

    <div id="status" class="status"></div>
  </div>

  <script type="application/javascript" src="./js/map.js"></script>
</body>


</html>
